version: "3.9"

services:

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama
    depends_on:
      - ollama
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      sh -c "
      echo 'Waiting for Ollama...' &&
      sleep 5 &&
      ollama pull qwen3-embedding:0.6b  &&
      echo 'Model pulled successfully'
      "
    restart: "no"

  backend:
    build: ./backend
    container_name: fastapi_app
    ports:
      - "8000:8000"
    depends_on:
      - ollama
      - ollama-init
    environment:
      - OLLAMA_HOST=http://ollama:11434

  frontend:
    build: ./frontend
    container_name: react_app
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  ollama_data: